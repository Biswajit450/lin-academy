<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWOS Exam Studio - Creator</title>

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- KaTeX (Math Engine) & Quill.js (Rich Editor) -->
    <link href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { blue: '#2563eb' } } } }
        }
    </script>

    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Premium Quill Editor Overrides */
        .ql-toolbar.ql-snow, .ql-container.ql-snow { border-color: #e2e8f0 !important; font-family: inherit; }
        .dark .ql-toolbar.ql-snow, .dark .ql-container.ql-snow { border-color: #334155 !important; }
        .ql-toolbar.ql-snow { background-color: #f8fafc; border-top-left-radius: 0.75rem; border-top-right-radius: 0.75rem; }
        .dark .ql-toolbar.ql-snow { background-color: #0f172a; }
        .ql-container.ql-snow { border-bottom-left-radius: 0.75rem; border-bottom-right-radius: 0.75rem; }
        .dark .ql-editor { color: #f1f5f9; }
        .ql-editor { min-height: 120px; font-size: 0.875rem; }
        .dark .ql-snow .ql-stroke { stroke: #94a3b8; }
        .dark .ql-snow .ql-fill { fill: #94a3b8; }
        .dark .ql-picker-label { color: #94a3b8; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300">

    <!-- 🚀 TOP NAVIGATION BAR -->
    <header class="h-14 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-4 shrink-0 shadow-sm z-50">
        <div class="flex items-center gap-4">
            <button id="btn-close-studio" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 hover:bg-rose-100 hover:text-rose-500 text-slate-500 transition-colors flex items-center justify-center">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div>
                <h1 class="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-flask text-emerald-500"></i> PWOS Exam Studio
                </h1>
                <p class="text-[10px] text-slate-500 font-medium tracking-widest uppercase">Workspace • Vault ID: <span id="header-vault-id" class="font-mono text-brand-blue">Unsaved</span></p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span id="auto-save-status" class="text-[10px] font-bold text-slate-400 hidden"><i class="fa-solid fa-check text-emerald-500 mr-1"></i> Saved</span>
            <button id="btn-theme" class="w-8 h-8 rounded-full text-amber-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition flex items-center justify-center"><i class="fa-solid fa-moon"></i></button>
            <button id="btn-save-vault" class="bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white text-xs font-bold px-5 py-2 rounded-lg shadow-md transition-transform active:scale-95 flex items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up"></i> Save to Vault
            </button>
        </div>
    </header>

    <!-- 🚀 MAIN WORKSPACE -->
    <div class="flex-grow flex overflow-hidden">
        
        <!-- LEFT SIDEBAR: Settings & Draft List -->
        <aside class="w-80 bg-slate-50 dark:bg-slate-900 border-r border-slate-200 dark:border-slate-700 flex flex-col shrink-0 overflow-y-auto hide-scrollbar">
            
            <!-- Global Settings Panel -->
            <div class="p-4 border-b border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 shadow-sm z-10 sticky top-0">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex justify-between items-center">
                    <span><i class="fa-solid fa-gear mr-1"></i> Global Settings</span>
                </h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Exam Title</label>
                        <input type="text" id="exam-setting-title" placeholder="e.g. UPSC Prelims Mock" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-md px-3 py-2 text-xs focus:outline-none focus:border-brand-blue dark:text-white transition">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Duration (Min)</label>
                            <input type="number" id="exam-setting-time" placeholder="120" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-md px-3 py-2 text-xs focus:outline-none focus:border-brand-blue dark:text-white transition">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Pass %</label>
                            <input type="number" id="exam-setting-pass" placeholder="40" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-md px-3 py-2 text-xs focus:outline-none focus:border-brand-blue dark:text-white transition">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-emerald-600 dark:text-emerald-500 uppercase mb-1">Correct (+)</label>
                            <input type="number" step="0.1" id="exam-setting-pos" placeholder="2.0" class="w-full bg-emerald-50 dark:bg-emerald-900/10 border border-emerald-200 dark:border-emerald-800/50 rounded-md px-3 py-2 text-xs focus:outline-none focus:border-emerald-500 dark:text-white transition">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-rose-500 uppercase mb-1">Incorrect (-)</label>
                            <input type="number" step="0.1" id="exam-setting-neg" placeholder="0.66" class="w-full bg-rose-50 dark:bg-rose-900/10 border border-rose-200 dark:border-rose-800/50 rounded-md px-3 py-2 text-xs focus:outline-none focus:border-rose-500 dark:text-white transition">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Drafted Questions List -->
            <div class="p-4 flex-grow flex flex-col">
                <div class="flex justify-between items-end mb-3">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest"><i class="fa-solid fa-list-ol mr-1"></i> Question Bank</h3>
                    <span class="bg-brand-blue text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm" id="draft-counter-badge">0</span>
                </div>
                
                <div id="draft-question-list" class="space-y-2 flex-grow overflow-y-auto hide-scrollbar">
                    <div class="text-center text-[10px] text-slate-400 font-bold uppercase py-6 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-lg">No questions drafted yet.</div>
                </div>
            </div>
        </aside>

        <!-- RIGHT WORKSPACE: Question Builder Engine -->
        <main class="flex-grow p-6 md:p-8 overflow-y-auto hide-scrollbar relative">
            <div class="max-w-4xl mx-auto space-y-6 pb-20">
                
                <!-- Action Bar -->
                <div class="flex justify-between items-end">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900 dark:text-white font-serif">Compose Question</h2>
                        <p class="text-xs text-slate-500">Add text, formulas, or images securely.</p>
                    </div>
                    <button id="btn-add-draft" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 hover:bg-slate-800 dark:hover:bg-slate-100 text-xs font-bold px-6 py-2.5 rounded-xl shadow-md transition-transform active:scale-95 flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Add to Draft
                    </button>
                </div>

                <!-- Hidden Input for Auto Image Uploader -->
                <input type="file" id="exam-image-upload" accept="image/*" class="hidden">

                <!-- 1. Question Editor -->
                <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 relative">
                    <span class="absolute -top-3 left-4 bg-slate-100 dark:bg-slate-700 px-3 py-0.5 rounded text-[10px] font-bold text-slate-500 dark:text-slate-300 uppercase tracking-widest border border-slate-200 dark:border-slate-600 shadow-sm z-10">Question Statement</span>
                    <div id="q-text-editor"></div>
                </div>

                <!-- 2. Options Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="relative">
                        <span class="absolute -top-2 left-3 bg-slate-50 dark:bg-slate-900 px-2 text-[9px] font-bold text-slate-400 uppercase tracking-widest">Option A</span>
                        <input type="text" id="q-opt0" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-blue dark:text-white transition">
                    </div>
                    <div class="relative">
                        <span class="absolute -top-2 left-3 bg-slate-50 dark:bg-slate-900 px-2 text-[9px] font-bold text-slate-400 uppercase tracking-widest">Option B</span>
                        <input type="text" id="q-opt1" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-blue dark:text-white transition">
                    </div>
                    <div class="relative">
                        <span class="absolute -top-2 left-3 bg-slate-50 dark:bg-slate-900 px-2 text-[9px] font-bold text-slate-400 uppercase tracking-widest">Option C</span>
                        <input type="text" id="q-opt2" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-blue dark:text-white transition">
                    </div>
                    <div class="relative">
                        <span class="absolute -top-2 left-3 bg-slate-50 dark:bg-slate-900 px-2 text-[9px] font-bold text-slate-400 uppercase tracking-widest">Option D</span>
                        <input type="text" id="q-opt3" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-blue dark:text-white transition">
                    </div>
                </div>

                <!-- 3. Correct Answer & Explanation -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2">
                    <div class="col-span-1">
                        <label class="block text-[10px] font-bold text-emerald-600 dark:text-emerald-500 uppercase tracking-widest mb-2"><i class="fa-solid fa-check-circle mr-1"></i> Correct Answer</label>
                        <select id="q-correct" class="w-full bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800/50 rounded-xl px-4 py-3 text-sm focus:outline-none text-emerald-800 dark:text-emerald-400 font-bold cursor-pointer transition">
                            <option value="0">Option A</option>
                            <option value="1">Option B</option>
                            <option value="2">Option C</option>
                            <option value="3">Option D</option>
                        </select>
                        <button id="btn-clear-workspace" class="mt-4 w-full text-[10px] text-slate-400 hover:text-rose-500 font-bold uppercase transition flex items-center justify-center gap-1 border border-slate-200 dark:border-slate-700 rounded-lg py-2 hover:bg-rose-50 dark:hover:bg-rose-900/20"><i class="fa-solid fa-eraser"></i> Clear Workspace</button>
                    </div>
                    
                    <div class="col-span-1 md:col-span-2 relative mt-3 md:mt-0">
                        <span class="absolute -top-3 left-4 bg-slate-100 dark:bg-slate-700 px-3 py-0.5 rounded text-[10px] font-bold text-slate-500 dark:text-slate-300 uppercase tracking-widest border border-slate-200 dark:border-slate-600 shadow-sm z-10"><i class="fa-solid fa-lightbulb text-amber-500 mr-1"></i> Detailed Explanation</span>
                        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                            <div id="q-exp-editor"></div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Hidden audio for Scrap Bin / Success SFX if needed later -->
    <audio id="sfx-crumple" src="https://assets.mixkit.co/active_storage/sfx/2049/2049-preview.mp3" preload="auto"></audio>

    <script type="module" src="creator.js"></script>
</body>
</html>
